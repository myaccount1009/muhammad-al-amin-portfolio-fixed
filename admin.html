<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05060a;color:#f2f4f8;font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}
.w{max-width:620px;margin:0 auto}h1{font-size:22px;font-weight:500;margin:0 0 18px}
input,textarea,button{width:100%;padding:12px;margin:0 0 10px;border-radius:8px;border:1px solid #2c3340;background:#11141b;color:#f2f4f8;font:inherit}
button{background:#f2f4f8;color:#05060a;font-weight:500;cursor:pointer;border:0}button.s{background:transparent;color:#8a93a6;border:1px solid #2c3340;width:auto;padding:6px 12px;margin:0}
label{display:block;font-size:13px;color:#8a93a6;margin:6px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #2c3340;border-radius:8px;padding:10px 12px;margin-bottom:8px}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;max-width:92%;background:#1b1f27;border:1px solid #f5b942;color:#f5b942;padding:10px 16px;border-radius:8px}#msg:empty{display:none}.hide{display:none}.bar{height:6px;background:#1b1f27;border-radius:3px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;width:0;background:#f5b942}
details{border:1px solid #2c3340;border-radius:10px;padding:12px;margin-bottom:10px}summary{cursor:pointer;font-weight:500}details label{margin-top:12px}details button{margin-top:12px}</style></head><body><div class="w">
<div id="login"><h1>Admin login</h1><input id="em" type="email" placeholder="name@company.com" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="lb">Log in</button></div>
<div id="app" class="hide"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h1 style="margin:0">Add project</h1><button class="s" id="lo">Log out</button></div>
<input id="ti" placeholder="Project title"><textarea id="de" rows="3" placeholder="Short description"></textarea>
<label>Video file (up to 50 MB)</label><input id="fi" type="file" accept="video/*">
<label>Or video link (YouTube or direct URL)</label><input id="ln" placeholder="https://youtu.be/...">
<div class="bar"><i id="pb"></i></div><button id="sb">Add project</button>
<h1 style="margin-top:28px">Your projects</h1><div id="list"></div>
<hr style="border:0;border-top:1px solid #2c3340;margin:28px 0">
<h1>Manage My Services</h1>
<p style="color:#8a93a6;margin:0 0 12px">Add or edit the service cards shown on your portfolio.</p>
<input id="sid" type="hidden">
<input id="stitle" placeholder="Service title">
<textarea id="sdesc" rows="3" placeholder="Service description"></textarea>
<input id="sorder" type="number" min="1" value="1" placeholder="Display order">
<button id="ssave">Add service</button><button class="s" id="scancel" type="button" style="display:none">Cancel edit</button>
<h1 style="margin-top:20px">Current services</h1><div id="slist"></div></div>
<hr style="border:0;border-top:1px solid #2c3340;margin:28px 0">
<h1>Edit Home, About &amp; Contact</h1>
<p style="color:#8a93a6;margin:0 0 12px">Change the text shown on your website. Use **text** to make words bold in About. WhatsApp button follows the phone number.</p>
<div id="content"></div></div>
<div id="msg"></div></div>
<script>
var U="https://aqialrhzvthtqlzrqlft.supabase.co";
var K="sb_publishable_X25I4XZBnnim3C2e4GIUbA_72mLALGL";
var $=function(i){return document.getElementById(i)},S=null,refreshing=null;

function msg(t){$('msg').textContent=t||""}
function save(s){
  S=s;
  try{
    if(s)localStorage.setItem('sb',JSON.stringify(s));
    else localStorage.removeItem('sb');
  }catch(e){}
}
function auth(body,type){
  return fetch(U+"/auth/v1/token?grant_type="+type,{
    method:"POST",
    headers:{apikey:K,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  }).then(async function(r){
    var d=await r.json();
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||"Authentication failed");
    return d;
  });
}
function refreshSession(){
  if(!S||!S.refresh_token)return Promise.reject(new Error("Please log in again."));
  if(refreshing)return refreshing;
  refreshing=auth({refresh_token:S.refresh_token},"refresh_token")
    .then(function(d){save(d);return d;})
    .catch(function(e){save(null);show();throw e;})
    .finally(function(){refreshing=null;});
  return refreshing;
}
function request(url,options,retried){
  options=options||{};
  options.headers=Object.assign({},options.headers||{},{
    apikey:K,
    Authorization:"Bearer "+(S&&S.access_token||K)
  });
  return fetch(url,options).then(async function(r){
    if(r.status===401&&!retried&&S&&S.refresh_token){
      await refreshSession();
      return request(url,options,true);
    }
    var text=await r.text(),data=null;
    try{data=text?JSON.parse(text):null;}catch(e){data=text;}
    if(!r.ok){
      var detail=data&&(data.message||data.msg||data.error_description||data.error||data.details);
      throw new Error(detail||("Request failed ("+r.status+")"));
    }
    return data;
  });
}
function show(){
  var loggedIn=!!(S&&S.access_token);
  $('login').classList.toggle('hide',loggedIn);
  $('app').classList.toggle('hide',!loggedIn);
  if(loggedIn){load();loadServices();loadContent();}
}
$('lb').onclick=function(){
  var email=$('em').value.trim(),password=$('pw').value;
  if(!email||!password){msg("Enter your email and password.");return;}
  $('lb').disabled=true;msg("Logging in…");
  auth({email:email,password:password},"password")
    .then(function(d){save(d);msg("");show();})
    .catch(function(e){msg(e.message==="Invalid login credentials"?"Wrong email or password. Try again.":e.message);})
    .finally(function(){$('lb').disabled=false;});
};
$('lo').onclick=function(){
  if(S&&S.access_token){
    fetch(U+"/auth/v1/logout",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+S.access_token}})
      .catch(function(){});
  }
  save(null);$('list').innerHTML="";msg("");show();
};
function load(){
  request(U+"/rest/v1/projects?select=*&order=created_at.desc")
    .then(function(rows){
      if(!Array.isArray(rows))throw new Error("Unexpected response while loading projects.");
      var l=$('list');l.innerHTML="";
      rows.forEach(function(p){
        var r=document.createElement('div');r.className='row';
        var t=document.createElement('span');t.textContent=p.title||"Untitled project";
        var b=document.createElement('button');b.className='s';b.textContent='Delete';
        b.onclick=function(){del(p);};
        r.appendChild(t);r.appendChild(b);l.appendChild(r);
      });
    })
    .catch(function(e){msg("Could not load projects: "+e.message);});
}
function del(p){
  if(!confirm('Delete "'+p.title+'"?'))return;
  var m=(p.video_url||"").split("/object/public/videos/")[1],warn="";
  request(U+"/rest/v1/projects?id=eq."+encodeURIComponent(p.id),{method:"DELETE",headers:{Prefer:"return=representation"}})
    .then(function(rows){
      if(!Array.isArray(rows)||!rows.length)throw new Error("Database did not allow delete. Run the SQL policy fix in Supabase.");
      if(m)return request(U+"/storage/v1/object/videos/"+m,{method:"DELETE"}).then(function(r){
        if(r&&Array.isArray(r)&&!r.length)warn=" Video file was not removed (storage policy).";
      }).catch(function(e){warn=" Video file was not removed: "+e.message;});
    })
    .then(function(){load();setTimeout(function(){msg("Project deleted."+warn);},400);})
    .catch(function(e){msg("Delete failed: "+e.message);});
}
function insert(url){
  return request(U+"/rest/v1/projects",{
    method:"POST",
    headers:{"Content-Type":"application/json",Prefer:"return=minimal"},
    body:JSON.stringify({
      title:$('ti').value.trim(),
      description:$('de').value.trim(),
      video_url:url||null
    })
  }).then(function(){
    msg("Project added successfully.");window.scrollTo({top:0,behavior:"smooth"});
    $('ti').value=$('de').value=$('ln').value="";
    $('fi').value="";$('pb').style.width="0";
    load();
  }).catch(function(e){msg("Couldn't add project: "+e.message);});
}
$('sb').onclick=function(){
  if(!$('ti').value.trim()){msg("Enter a project title.");return;}
  var f=$('fi').files[0];
  if(!f){
    var link=$('ln').value.trim();
    if(!link){msg("Select a video file or paste a video link.");return;}
    if(!/^https?:\/\//i.test(link)){msg("Link must start with https://");return;}
    insert(link);return;
  }
  if(f.size>50*1024*1024){msg("Video is over 50 MB. Compress it or use a YouTube link.");return;}
  var name=Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_"),x=new XMLHttpRequest();
  x.open("POST",U+"/storage/v1/object/videos/"+name);
  x.setRequestHeader("apikey",K);
  x.setRequestHeader("Authorization","Bearer "+S.access_token);
  x.setRequestHeader("Content-Type",f.type||"video/mp4");
  x.upload.onprogress=function(e){
    if(e.lengthComputable){
      var p=Math.round(e.loaded/e.total*100);
      $('pb').style.width=p+"%";msg("Uploading "+p+"%");
    }
  };
  x.onload=function(){
    if(x.status<300)insert(U+"/storage/v1/object/public/videos/"+name);
    else{
      var detail="Upload failed ("+x.status+").";
      try{var d=JSON.parse(x.responseText);detail=d.message||d.error||detail;}catch(e){}
      msg(detail);
    }
  };
  x.onerror=function(){msg("Upload failed. Check your internet and retry.");};
  x.send(f);
};
function loadServices(){
 request(U+"/rest/v1/services?select=*&order=sort_order.asc")
 .then(function(rows){
  var l=$('slist');l.innerHTML="";
  if(!Array.isArray(rows)||!rows.length){l.textContent="No services yet. Add your first service above.";return;}
  rows.forEach(function(x){
   var r=document.createElement('div');r.className='row';
   var t=document.createElement('span');t.textContent=x.sort_order+". "+x.title;
   var actions=document.createElement('div');actions.style.display='flex';actions.style.gap='6px';
   var e=document.createElement('button');e.className='s';e.textContent='Edit';
   e.onclick=function(){$('sid').value=x.id;$('stitle').value=x.title||"";$('sdesc').value=x.description||"";$('sorder').value=x.sort_order||1;$('ssave').textContent='Save changes';$('scancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'});};
   var d=document.createElement('button');d.className='s';d.textContent='Delete';
   d.onclick=function(){if(!confirm('Delete service "'+x.title+'"?'))return;request(U+"/rest/v1/services?id=eq."+encodeURIComponent(x.id),{method:'DELETE',headers:{Prefer:'return=representation'}}).then(function(r){if(!Array.isArray(r)||!r.length)throw new Error('Database did not allow delete.');loadServices();}).catch(function(err){msg('Service delete failed: '+err.message);});};
   actions.appendChild(e);actions.appendChild(d);r.appendChild(t);r.appendChild(actions);l.appendChild(r);
  });
 }).catch(function(e){$('slist').textContent="Could not load services: "+e.message;});
}
function resetServiceForm(){$('sid').value='';$('stitle').value='';$('sdesc').value='';$('sorder').value='1';$('ssave').textContent='Add service';$('scancel').style.display='none';}
$('scancel').onclick=resetServiceForm;
$('ssave').onclick=function(){
 var title=$('stitle').value.trim(),description=$('sdesc').value.trim(),order=parseInt($('sorder').value,10)||1,id=$('sid').value;
 if(!title){msg('Enter a service title.');return;}
 var url=U+'/rest/v1/services'+(id?'?id=eq.'+encodeURIComponent(id):'');
 request(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({title:title,description:description,sort_order:order})})
 .then(function(){msg(id?'Service updated.':'Service added.');resetServiceForm();loadServices();})
 .catch(function(e){msg('Could not save service: '+e.message);});
};

var CF={
 home:["Home section",[
  ["home_label","Small label","AI Automation Engineer"],
  ["home_title","Main title (first word on top line, rest below)","Muhammad Al-Amin"],
  ["home_text","Intro text","I build smart AI-powered automation systems that reduce repetitive work, improve business efficiency, and turn manual processes into intelligent workflows.",1],
  ["home_tags","Skills line","AI Automation • AI Agents • n8n • API Integrations • Business Process Automation"],
  ["home_btn1","Button 1 text","View my projects"],
  ["home_btn2","Button 2 text","Let's work together"]]],
 about:["About section",[
  ["about_title","Title (last word is highlighted)","About me"],
  ["about_text1","Paragraph 1","I'm **Muhammad Al-Amin**, an AI Automation Engineer focused on building practical AI systems for businesses. My work combines **AI, automation, APIs, and business workflows** to handle repetitive tasks with minimal human intervention.",1],
  ["about_text2","Paragraph 2","I work mainly with **n8n, OpenAI, APIs, Google Sheets, webhooks**, and AI automation platforms, building real systems for lead generation, customer communication, data processing, and business operations.",1],
  ["about_quote","Quote","Build automation that solves real business problems, not just impressive demos."]]],
 contact:["Contact section",[
  ["contact_label","Small label","Get in touch"],
  ["contact_title","Title (last two words are highlighted)","Let's automate your business"],
  ["contact_text","Text","Have a repetitive business process that takes too much time? Let's turn it into an intelligent automated workflow.",1],
  ["contact_phone","Phone / WhatsApp number","01753400250"],
  ["contact_email","Email","shaon555000@gmail.com"],
  ["contact_facebook","Facebook link","https://www.facebook.com/profile.php?id=61581135051827"],
  ["contact_linkedin","LinkedIn link","https://www.linkedin.com/in/muhammad-al-amin-08866b3ab"],
  ["contact_btn","Button text","Let's build something smart"]]]};
var built=false;
function buildContent(){
 if(built)return;built=true;var box=$('content');
 Object.keys(CF).forEach(function(sec){
  var d=document.createElement('details'),sm=document.createElement('summary');sm.textContent=CF[sec][0];d.appendChild(sm);
  CF[sec][1].forEach(function(f){
   var l=document.createElement('label');l.textContent=f[1];d.appendChild(l);
   var i=document.createElement(f[3]?'textarea':'input');if(f[3])i.rows=4;i.id='f_'+f[0];i.value=f[2];d.appendChild(i)});
  var b=document.createElement('button');b.textContent='Save '+CF[sec][0];b.onclick=function(){saveSection(sec)};d.appendChild(b);box.appendChild(d)})}
function loadContent(){buildContent();
 request(U+"/rest/v1/site_content?select=key,value").then(function(rows){
  if(!Array.isArray(rows))return;rows.forEach(function(r){var e=$('f_'+r.key);if(e&&r.value)e.value=r.value})})
 .catch(function(e){msg("Could not load site content: "+e.message)})}
function saveSection(sec){
 var rows=CF[sec][1].map(function(f){return{key:f[0],value:$('f_'+f[0]).value.trim()}});
 request(U+"/rest/v1/site_content",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)})
 .then(function(){msg(CF[sec][0]+" saved. Refresh your website to see it.")})
 .catch(function(e){msg("Save failed: "+e.message+" (run the site_content SQL in Supabase)")})}
(function init(){
  try{
    var saved=JSON.parse(localStorage.getItem('sb')||"null");
    if(saved&&saved.refresh_token){
      S=saved;
      refreshSession().then(function(){show();})
        .catch(function(){msg("Session expired. Please log in again.");});
    }else{
      save(null);show();
    }
  }catch(e){save(null);show();}
})();
</script></body></html>
